name: Claude Code Dependency Review

on:
  workflow_call:
    secrets:
      # Deprecated: unused since the migration to Anthropic WIF, kept so callers passing them keep working
      GCP_WORKLOAD_IDENTITY_PROVIDER:
        required: false
        description: Deprecated, unused
      GCP_SERVICE_ACCOUNT:
        required: false
        description: Deprecated, unused
      ANTHROPIC_VERTEX_PROJECT_ID:
        required: false
        description: Deprecated, unused
      CLOUD_ML_REGION:
        required: false
        description: Deprecated, unused
      ACTIONS_APP_PRIVATE_KEY:
        required: false
        description: Private key for the GitHub App used to access private repositories
    inputs:
      ACTIONS_APP_ID:
        required: false
        type: string
        description: App ID for the GitHub App used to access private repositories during dependency install. The agent-hub marketplace is checked out with the ACTIONS_APP_ID org variable when this is not set
      node-version:
        required: false
        type: string
        default: '22'
        description: Node.js version to use for dependency installation
      model:
        type: string
        description: Claude model to use for the review
        default: claude-opus-5-5
      anthropic_federation_rule_id:
        type: string
        required: false
        default: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
        description: Anthropic federation rule ID (fdrl_...). Defaults to the ANTHROPIC_FEDERATION_RULE_ID org variable
      anthropic_organization_id:
        type: string
        required: false
        default: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
        description: Anthropic organization ID (UUID from Console → Settings → Organization). Defaults to the ANTHROPIC_ORGANIZATION_ID org variable
      anthropic_service_account_id:
        type: string
        required: false
        default: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
        description: Anthropic service account ID (svac_...). Defaults to the ANTHROPIC_SERVICE_ACCOUNT_ID org variable
      anthropic_workspace_id:
        type: string
        required: false
        default: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
        description: Anthropic workspace ID (wrkspc_...). Defaults to the ANTHROPIC_WORKSPACE_ID org variable
      cost_report_repo:
        type: string
        required: false
        default: "cost-center-review"
        description: Repository (in the same org) where monthly cost reports are written

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      id-token: write
      checks: read
      actions: read
    env:
      # secrets context is not available in step conditions
      HAS_APP_KEY: ${{ secrets.ACTIONS_APP_PRIVATE_KEY != '' }}

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Generate token for private repositories
        if: inputs.ACTIONS_APP_ID != ''
        continue-on-error: true
        uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ inputs.ACTIONS_APP_ID }}
          private-key: ${{ secrets.ACTIONS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Configure git for private repositories
        if: steps.app-token.outputs.token != ''
        run: |
          git config --global url."https://x-access-token:${GIT_ACCESS_TOKEN}@github.com/".insteadOf "https://github.com/"
        env:
          GIT_ACCESS_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Set up Node.js
        if: hashFiles('yarn.lock') != ''
        uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}

      - name: Install dependencies
        id: install-deps
        if: hashFiles('yarn.lock') != ''
        continue-on-error: true
        run: yarn install --frozen-lockfile --ignore-scripts

      - name: Warn on failed dependency install
        if: steps.install-deps.outcome == 'failure'
        run: echo "::warning::yarn install failed — dependency review will run without node_modules. This may happen if the project uses private registries requiring authentication."

      # The token is owner-wide: do not leave it readable by Claude
      - name: Remove git credentials for private repositories
        if: always() && steps.app-token.outputs.token != ''
        run: git config --global --remove-section "url.https://x-access-token:${GIT_ACCESS_TOKEN}@github.com/"
        env:
          GIT_ACCESS_TOKEN: ${{ steps.app-token.outputs.token }}

      # agent-hub is internal: clone it with a token scoped to it, then drop the remote
      # so the token does not stay on disk
      - name: Get token for marketplace repository
        id: marketplace-token
        if: env.HAS_APP_KEY == 'true'
        continue-on-error: true
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ inputs.ACTIONS_APP_ID || vars.ACTIONS_APP_ID }}
          private-key: ${{ secrets.ACTIONS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: agent-hub

      - name: Checkout marketplace repository
        id: marketplace
        if: steps.marketplace-token.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.marketplace-token.outputs.token }}
        run: |
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/scality/agent-hub.git" .marketplaces/scality-agent-hub
          git -C .marketplaces/scality-agent-hub remote remove origin

      - name: Warn on missing marketplace
        if: steps.marketplace.outcome != 'success'
        run: echo "::warning::Could not check out scality/agent-hub (ACTIONS_APP_PRIVATE_KEY not passed or token generation failed); the review will likely fail to load the review-dependency-bump skill."

      - name: Run Claude Code Dependency Review
        id: dependency-review
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          github_token: ${{ github.token }}
          anthropic_federation_rule_id: ${{ inputs.anthropic_federation_rule_id }}
          anthropic_organization_id: ${{ inputs.anthropic_organization_id }}
          anthropic_service_account_id: ${{ inputs.anthropic_service_account_id }}
          anthropic_workspace_id: ${{ inputs.anthropic_workspace_id }}
          allowed_bots: "dependabot[bot], scality-renovate[bot]"
          plugin_marketplaces: ${{ steps.marketplace.outcome == 'success' && './.marketplaces/scality-agent-hub' || 'https://github.com/scality/agent-hub.git' }}
          plugins: scality-skills@scality-agent-hub
          prompt: "/review-dependency-bump REPO: ${{ github.repository }} PR_NUMBER: ${{ github.event.pull_request.number }}"
          claude_args: |
            --allowedTools "Read" "Grep" "WebFetch" "Bash(gh repo view *)" "Bash(gh pr view *)" "Bash(gh pr comment *)" "Bash(gh pr review *)" "Bash(gh api *)"
            --model "${{ inputs.model }}"
        env:
          ANTHROPIC_USER_ID: ${{ github.repository }}

      - name: Get token for cost reporting
        id: cost-token
        if: always() && env.HAS_APP_KEY == 'true'
        continue-on-error: true
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ inputs.ACTIONS_APP_ID || vars.ACTIONS_APP_ID }}
          private-key: ${{ secrets.ACTIONS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ inputs.cost_report_repo }}

      - name: Record cost in central report
        if: always() && steps.cost-token.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.cost-token.outputs.token }}
          EXECUTION_FILE: ${{ steps.dependency-review.outputs.execution_file }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || 0 }}
          MODEL: ${{ inputs.model }}
          COST_REPORT_REPO: ${{ github.repository_owner }}/${{ inputs.cost_report_repo }}
        run: |
          # No execution file means Claude did not run
          if [ -z "$EXECUTION_FILE" ] || [ ! -f "$EXECUTION_FILE" ]; then
            echo "No execution file, skipping cost report"
            exit 0
          fi
          # The execution file is an array of SDK messages; the cost is on the final "result" message
          cost=$(jq -r '[.[] | select(.type == "result")] | last | .total_cost_usd // 0' "$EXECUTION_FILE")
          month=$(date -u +%Y-%m)
          file_path="cost-reports/cost-data-${month}.json"
          now=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          for attempt in 1 2 3; do
            api_response=$(gh api "repos/${COST_REPORT_REPO}/contents/${file_path}" 2>/dev/null || echo '{}')
            sha=$(echo "$api_response" | jq -r '.sha // empty')
            current_content=$(echo "$api_response" | jq -r '.content // ""' | tr -d '\n' | base64 --decode 2>/dev/null || true)
            # One entry per repo, shared with claude-code-review, accumulated over the month; costs rounded to the cent
            encoded_content=$(printf '%s' "${current_content:-{\}}" | jq -S \
              --arg repo "$REPO" \
              --arg date "$now" \
              --arg model "$MODEL" \
              --argjson cost "${cost:-0}" \
              '.[$repo] |= {
                total_cost_usd: ((((.total_cost_usd // 0) + $cost) * 100 | round) / 100),
                runs: ((.runs // 0) + 1),
                last_run: $date,
                model: $model
              }' | base64 -w 0)

            put_args=(-X PUT \
              -f "message=chore: claude dependency review cost ${REPO} PR#${PR_NUMBER}" \
              -f "content=${encoded_content}")
            [ -n "$sha" ] && put_args+=(-f "sha=${sha}")

            if error=$(gh api "repos/${COST_REPORT_REPO}/contents/${file_path}" "${put_args[@]}" 2>&1 > /dev/null); then
              echo "Cost recorded: $(jq -n --argjson c "$cost" '($c * 100 | round) / 100') USD for ${REPO}"
              exit 0
            fi
            echo "Attempt $attempt failed: ${error}"
            sleep $((attempt * 3))
          done
          echo "::warning::Could not record cost in ${COST_REPORT_REPO}: ${error}"
